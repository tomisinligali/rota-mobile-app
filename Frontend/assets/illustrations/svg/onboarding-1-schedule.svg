<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Warm palette over a vertical purple-to-white backdrop gradient. -->
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <!-- Vertical backdrop gradient: the top half keeps the primaryContainer purple,
         the bottom half fades to a subtle light-purple tint so the circle edge stays
         visible against the screen background. -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1E9FB"/>
      <stop offset="0.45" stop-color="#F1E9FB"/>
      <stop offset="1" stop-color="#EBE1F9"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="512" height="512" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="254" fill="url(#bgGrad)"/>
  <ellipse cx="256" cy="438" rx="150" ry="26" fill="#2E2B27" opacity="0.10" filter="url(#soft)"/>

  <!-- floating calendar (upper-left) -->
  <g>
    <rect x="90" y="98" width="82" height="82" rx="16" fill="#FFFFFF" stroke="#6600CC" stroke-width="6"/>
    <rect x="90" y="98" width="82" height="28" rx="14" fill="#6600CC"/>
    <rect x="90" y="112" width="82" height="14" fill="#6600CC"/>
    <line x1="112" y1="86" x2="112" y2="104" stroke="#6600CC" stroke-width="6" stroke-linecap="round"/>
    <line x1="150" y1="86" x2="150" y2="104" stroke="#6600CC" stroke-width="6" stroke-linecap="round"/>
    <circle cx="116" cy="148" r="4" fill="#6600CC"/>
    <circle cx="131" cy="148" r="4" fill="#6600CC"/>
    <circle cx="146" cy="148" r="4" fill="#6600CC"/>
    <circle cx="116" cy="163" r="4" fill="#6600CC"/>
    <circle cx="131" cy="163" r="4" fill="#6600CC"/>
    <circle cx="146" cy="163" r="4" fill="#6600CC"/>
  </g>

  <!-- wall clock (upper-right) -->
  <g>
    <circle cx="408" cy="118" r="36" fill="#FFFFFF" stroke="#6600CC" stroke-width="7"/>
    <line x1="408" y1="118" x2="408" y2="98" stroke="#6600CC" stroke-width="7" stroke-linecap="round"/>
    <line x1="408" y1="118" x2="423" y2="126" stroke="#6600CC" stroke-width="7" stroke-linecap="round"/>
    <circle cx="408" cy="118" r="5" fill="#6600CC"/>
  </g>

  <!-- schedule board -->
  <g>
    <rect x="238" y="176" width="212" height="180" rx="20" fill="#FFFFFF" stroke="#E4DACB" stroke-width="4"/>
    <rect x="256" y="196" width="118" height="14" rx="7" fill="#2E2B27" opacity="0.85"/>
    <g fill="#F0EAE0">
      <rect x="256" y="226" width="40" height="34" rx="9"/>
      <rect x="304" y="226" width="40" height="34" rx="9"/>
      <rect x="352" y="226" width="40" height="34" rx="9"/>
      <rect x="400" y="226" width="34" height="34" rx="9"/>
      <rect x="256" y="268" width="40" height="34" rx="9"/>
      <rect x="304" y="268" width="40" height="34" rx="9"/>
      <rect x="352" y="268" width="40" height="34" rx="9"/>
      <rect x="256" y="310" width="40" height="34" rx="9"/>
      <rect x="304" y="310" width="40" height="34" rx="9"/>
    </g>
    <rect x="400" y="268" width="34" height="34" rx="9" fill="#6600CC"/>
    <rect x="352" y="310" width="40" height="34" rx="9" fill="#E0A62A"/>
  </g>

  <!-- manager character -->
  <g>
    <!-- legs / trousers -->
    <rect x="132" y="330" width="18" height="52" rx="9" fill="#2E2B27"/>
    <rect x="154" y="330" width="18" height="52" rx="9" fill="#2E2B27"/>
    <!-- torso -->
    <path d="M126 250 q26 -14 52 0 l6 86 q-32 10 -64 0 z" fill="#BFA0EE"/>
    <!-- left arm -->
    <rect x="120" y="258" width="16" height="66" rx="8" fill="#C9A7F0"/>
    <circle cx="128" cy="328" r="9" fill="#C68642"/>
    <!-- right arm reaching to board -->
    <rect x="168" y="252" width="96" height="16" rx="8" fill="#C9A7F0" transform="rotate(18 172 260)"/>
    <circle cx="262" cy="292" r="10" fill="#C68642"/>
    <!-- neck -->
    <rect x="144" y="232" width="16" height="18" fill="#B5793B"/>
    <!-- head -->
    <circle cx="152" cy="216" r="24" fill="#C68642"/>
    <!-- hair -->
    <path d="M128 212 q3 -26 24 -26 q21 0 24 26 q-10 -12 -24 -12 q-14 0 -24 12 z" fill="#2E2B27"/>
  </g>

  <!-- desk -->
  <g>
    <rect x="58" y="366" width="396" height="24" rx="12" fill="#FFFFFF"/>
    <rect x="58" y="366" width="396" height="24" rx="12" fill="none" stroke="#E4DACB" stroke-width="3"/>
    <rect x="96" y="390" width="20" height="46" rx="8" fill="#EFE8DD"/>
    <rect x="396" y="390" width="20" height="46" rx="8" fill="#EFE8DD"/>
  </g>

  <!-- block being placed, in hand -->
  <rect x="238" y="270" width="34" height="34" rx="9" fill="#E0A62A" stroke="#C98E1C" stroke-width="2"/>
</svg>
