version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rota_postgres
    restart: always
    environment:
      POSTGRES_USER: rota_user
      POSTGRES_PASSWORD: rota_password
      POSTGRES_DB: rota_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rota_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: rota_api
    restart: always
    ports:
      - '5001:5001'
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgresql://rota_user:rota_password@postgres:5432/rota_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: production-secret-key-replace-with-secure-value
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
